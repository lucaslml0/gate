name: VPN Gate Node Check

on:
  workflow_dispatch:
    inputs:
      country:
        description: "节点国家（例如 US、JP、SG、ALL）"
        required: false
        type: string
        default: ""
      protocol:
        description: "节点协议：vless、outline、trojan、all；留空则读取仓库变量 PROTOCOL"
        required: false
        type: string
        default: ""
      limit:
        description: "输出节点数量（1-500）"
        required: false
        type: string
        default: ""
      online_only:
        description: "只输出在线节点（true/false）；留空则读取仓库变量 ONLINE_ONLY"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Action input 优先；未填写时使用仓库 Variables；最后使用默认值。
      COUNTRY: ${{ inputs.country || vars.COUNTRY || 'US' }}
      PROTOCOL: ${{ inputs.protocol || vars.PROTOCOL || 'vless' }}
      LIMIT: ${{ inputs.limit || vars.LIMIT || '50' }}
      ONLINE_ONLY: ${{ inputs.online_only || vars.ONLINE_ONLY || 'true' }}
      MAX_PAGES: ${{ vars.MAX_PAGES || '10' }}
      OUTPUT_FILE: public/jiedian.txt
      GENERATE_ONLY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://check.socks5.cmliussss.net/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Generate OutlineKeys jiedian.txt
        run: python outlinekeys_api.py
        env:
          COUNTRY: ${{ env.COUNTRY }}
          PROTOCOL: ${{ env.PROTOCOL }}
          LIMIT: ${{ env.LIMIT }}
          ONLINE_ONLY: ${{ env.ONLINE_ONLY }}
          MAX_PAGES: ${{ env.MAX_PAGES }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          GENERATE_ONLY: "true"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://lucaslml0.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
